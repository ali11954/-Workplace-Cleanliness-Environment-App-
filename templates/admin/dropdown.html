<!-- templates/notifications/dropdown.html -->
<div class="dropdown notifications-dropdown">
    <button class="btn btn-notification dropdown-toggle position-relative"
            type="button" data-bs-toggle="dropdown">
        <i class="fas fa-bell"></i>
        {% if unread_count > 0 %}
        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
            {{ unread_count }}
        </span>
        {% endif %}
    </button>

    <div class="dropdown-menu dropdown-menu-end">
        <div class="dropdown-header">
            <div class="d-flex justify-content-between align-items-center">
                <span>الإشعارات</span>
                {% if unread_count > 0 %}
                <button class="btn btn-sm btn-outline-primary mark-all-read">
                    تعليم الكل كمقروء
                </button>
                {% endif %}
            </div>
        </div>

        <div class="notifications-list" style="max-height: 300px; overflow-y: auto;">
            {% for notification in notifications %}
            <div class="dropdown-item notification-item {% if not notification.is_read %}unread{% endif %}"
                 data-notification-id="{{ notification.id }}">
                <div class="d-flex align-items-start">
                    <div class="notification-icon me-2">
                        <i class="fas
                            {% if notification.notification_type == 'success' %}fa-check-circle text-success
                            {% elif notification.notification_type == 'warning' %}fa-exclamation-triangle text-warning
                            {% elif notification.notification_type == 'danger' %}fa-times-circle text-danger
                            {% else %}fa-info-circle text-info{% endif %}">
                        </i>
                    </div>
                    <div class="notification-content flex-grow-1">
                        <h6 class="mb-1">{{ notification.title }}</h6>
                        <p class="mb-1 small">{{ notification.message }}</p>
                        <small class="text-muted">{{ notification.created_at|timesince }}</small>
                    </div>
                    {% if not notification.is_read %}
                    <div class="notification-actions">
                        <button class="btn btn-sm mark-read" title="تعليم كمقروء">
                            <i class="fas fa-check"></i>
                        </button>
                    </div>
                    {% endif %}
                </div>
            </div>
            {% else %}
            <div class="dropdown-item text-center text-muted">
                لا توجد إشعارات
            </div>
            {% endfor %}
        </div>

        <div class="dropdown-footer text-center p-2">
            <a href="{{ url_for('notifications.list') }}" class="btn btn-sm btn-outline-secondary">
                عرض جميع الإشعارات
            </a>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // تعليم إشعار كمقروء
    document.querySelectorAll('.mark-read').forEach(button => {
        button.addEventListener('click', function(e) {
            e.stopPropagation();
            const notificationItem = this.closest('.notification-item');
            const notificationId = notificationItem.dataset.notificationId;

            fetch(`/notifications/${notificationId}/mark-read`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            }).then(response => {
                if (response.ok) {
                    notificationItem.classList.remove('unread');
                    this.remove();
                    updateUnreadCount();
                }
            });
        });
    });

    // تعليم جميع الإشعارات كمقروءة
    document.querySelector('.mark-all-read')?.addEventListener('click', function() {
        fetch('/notifications/mark-all-read', {
            method: 'POST'
        }).then(response => {
            if (response.ok) {
                document.querySelectorAll('.notification-item.unread').forEach(item => {
                    item.classList.remove('unread');
                    item.querySelector('.mark-read')?.remove();
                });
                updateUnreadCount();
            }
        });
    });

    function updateUnreadCount() {
        // تحديث العداد (يمكن تحديث الصفحة أو استخدام AJAX)
        location.reload();
    }
});
</script>
